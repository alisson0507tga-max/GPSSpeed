name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'css/**'
      - 'js/**'
      - 'pages/**'
      - 'assets/**'
      - 'index.html'
      - 'manifest.json'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restaurar assinatura debug fixa
        id: debug-key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: gpsspeed-debug-keystore-v2

      - name: Criar assinatura debug fixa na primeira build
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=GPSSpeed Debug,O=GPSSpeed,C=BR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Gerar APK debug
        run: gradle :app:assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: GPSSpeed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
