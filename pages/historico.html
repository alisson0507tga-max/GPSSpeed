<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Linha do tempo - GPSSpeed</title><link rel="stylesheet" href="../css/style.css"><style>.timeline-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}.timeline-overview .stat-card{min-height:auto;padding:14px}.day-block{display:grid;gap:12px;margin-bottom:22px}.day-header{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:0 4px}.day-header h2{margin:0;font-size:20px}.day-total{font-size:14px;opacity:.8;text-align:right}.history-list{display:grid;gap:14px}.history-card{position:relative;display:grid;gap:10px;padding:18px 18px 18px 24px;border-radius:18px;background:#182235}.history-card::before{content:"";position:absolute;left:10px;top:22px;bottom:22px;width:3px;border-radius:99px;background:#22c55e}.history-head{display:flex;justify-content:space-between;gap:12px}.history-time{font-size:14px;opacity:.78}.history-main{font-size:26px;font-weight:800}.history-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px}.history-actions{display:flex;gap:10px}.history-actions a{flex:1;text-align:center;padding:11px;border-radius:12px;text-decoration:none;background:#223047;color:#fff}.tag{display:inline-flex;width:max-content;padding:4px 8px;border-radius:999px;background:#0f172a;color:#94a3b8;font-size:11px}@media(max-width:380px){.timeline-overview{grid-template-columns:1fr}.history-meta{grid-template-columns:1fr}}</style></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">POR ONDE VOCÊ PASSOU</p><h1>Linha do tempo</h1></div></header><section id="overview" class="timeline-overview" hidden></section><section id="timeline"></section><p id="emptyTrips" class="location-card">Nenhum percurso salvo ainda.</p><nav class="bottom-nav"><a href="../index.html">Velocímetro</a><a href="mapa.html">Mapa</a><a class="active" href="historico.html">Percursos</a><a href="estatisticas.html">Estatísticas</a><a href="configuracoes.html">Config.</a></nav></main><script src="../js/utils.js"></script><script src="../js/database.js"></script><script src="../js/trips.js"></script><script>(()=>{const timeline=document.getElementById('timeline'),empty=document.getElementById('emptyTrips'),overview=document.getElementById('overview'),trips=GPSSpeedTrips.getTrips().slice().sort((a,b)=>(+b.startedAt||0)-(+a.startedAt||0));if(!trips.length){empty.hidden=false;return;}empty.hidden=true;const totalKm=trips.reduce((s,t)=>s+(+t.distanceKm||0),0),totalMs=trips.reduce((s,t)=>s+(+t.elapsedMs||0),0),max=trips.reduce((m,t)=>Math.max(m,+t.maxSpeed||0),0);overview.hidden=false;overview.innerHTML=`<article class="stat-card"><span>Total</span><strong>${GPSSpeedUtils.formatDistanceKm(totalKm)}</strong></article><article class="stat-card"><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(totalMs)}</strong></article><article class="stat-card"><span>Maior velocidade</span><strong>${GPSSpeedUtils.formatSpeed(max)}</strong></article>`;const dayKey=ms=>{const d=new Date(+ms||Date.now());return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;},dayLabel=ms=>new Date(+ms||Date.now()).toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}),time=ms=>new Date(+ms||Date.now()).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),groups=new Map();trips.forEach(t=>{const k=dayKey(t.startedAt);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t);});timeline.innerHTML=[...groups.values()].map(dayTrips=>{const dayKm=dayTrips.reduce((s,t)=>s+(+t.distanceKm||0),0),dayMs=dayTrips.reduce((s,t)=>s+(+t.elapsedMs||0),0),cards=dayTrips.map(t=>`<article class="history-card"><span class="tag">${t.automatic?'AUTOMÁTICO':'MANUAL'} • ${t.kilometerSplits?.length||0} km completos</span><div class="history-head"><div><div class="history-time">${time(t.startedAt)} → ${time(t.finishedAt||t.startedAt)}</div><div class="history-main">${GPSSpeedUtils.formatDistanceKm(t.distanceKm)}</div></div><strong>${GPSSpeedUtils.formatDuration(t.elapsedMs)}</strong></div><div class="history-meta"><span>Média: <strong>${GPSSpeedUtils.formatSpeed(t.averageSpeed)}</strong></span><span>Máxima: <strong>${GPSSpeedUtils.formatSpeed(t.maxSpeed)}</strong></span><span>Movimento: <strong>${GPSSpeedUtils.formatDuration(t.movingMs)}</strong></span><span>Parado: <strong>${GPSSpeedUtils.formatDuration(t.stoppedMs)}</strong></span><span>Pontos GPS: <strong>${t.pointCount||0}</strong></span><span>Km registrados: <strong>${t.kilometerSplits?.length||0}</strong></span></div><div class="history-actions"><a href="mapa.html?id=${encodeURIComponent(t.id)}">Ver trajeto</a><a href="viagem.html?id=${encodeURIComponent(t.id)}">Detalhes</a></div></article>`).join('');return`<section class="day-block"><div class="day-header"><h2>${GPSSpeedUtils.escapeHtml(dayLabel(dayTrips[0].startedAt))}</h2><div class="day-total">${GPSSpeedUtils.formatDistanceKm(dayKm)}<br>${GPSSpeedUtils.formatDuration(dayMs)}</div></div><div class="history-list">${cards}</div></section>`;}).join('');})();</script></body></html>
