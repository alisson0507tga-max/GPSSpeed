<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <title>Linha do tempo - GPSSpeed</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .timeline-overview{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
    .timeline-overview .stat-card{min-height:auto;padding:14px}
    .timeline-overview .stat-card strong{font-size:20px}
    .day-block{display:grid;gap:12px;margin-bottom:22px}
    .day-header{display:flex;align-items:end;justify-content:space-between;gap:12px;padding:0 4px}
    .day-header h2{margin:0;font-size:20px}.day-total{font-size:14px;opacity:.8;text-align:right}
    .history-list{display:grid;gap:14px}
    .history-card{position:relative;display:grid;gap:10px;padding:18px 18px 18px 24px;border-radius:18px;background:var(--card,#182235)}
    .history-card::before{content:"";position:absolute;left:10px;top:22px;bottom:22px;width:3px;border-radius:99px;background:#22c55e}
    .history-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .history-time{font-size:14px;opacity:.78}.history-main{font-size:26px;font-weight:800;margin-top:2px}
    .history-meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;font-size:14px;opacity:.92}
    .history-actions{display:flex;gap:10px}.history-actions a{flex:1;text-align:center;padding:11px;border-radius:12px;text-decoration:none;background:#223047;color:inherit}
    @media(max-width:380px){.timeline-overview{grid-template-columns:1fr}.history-meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><p class="eyebrow">POR ONDE VOCÊ PASSOU</p><h1>Linha do tempo</h1></div></header>

    <section id="overview" class="timeline-overview" hidden></section>
    <section id="timeline"></section>
    <p id="emptyTrips" class="location-card">Nenhum percurso salvo ainda.</p>

    <nav class="bottom-nav" aria-label="Navegação principal">
      <a href="../index.html">Velocímetro</a>
      <a href="mapa.html">Mapa</a>
      <a class="active" href="historico.html">Histórico</a>
      <a href="configuracoes.html">Config.</a>
    </nav>
  </main>

  <script src="../js/utils.js"></script>
  <script src="../js/database.js"></script>
  <script src="../js/trips.js"></script>
  <script>
    (() => {
      const timeline = document.getElementById('timeline');
      const empty = document.getElementById('emptyTrips');
      const overview = document.getElementById('overview');
      const trips = window.GPSSpeedTrips.getTrips()
        .slice()
        .sort((a,b) => (Number(b.startedAt)||0) - (Number(a.startedAt)||0));

      if (!trips.length) {
        empty.hidden = false;
        return;
      }

      empty.hidden = true;

      const totalKm = trips.reduce((sum,t) => sum + (Number(t.distanceKm)||0), 0);
      const totalMs = trips.reduce((sum,t) => sum + (Number(t.elapsedMs)||0), 0);
      const maxSpeed = trips.reduce((max,t) => Math.max(max, Number(t.maxSpeed)||0), 0);
      overview.hidden = false;
      overview.innerHTML = `
        <article class="stat-card"><span>Total</span><strong>${GPSSpeedUtils.formatDistanceKm(totalKm)}</strong></article>
        <article class="stat-card"><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(totalMs)}</strong></article>
        <article class="stat-card"><span>Maior velocidade</span><strong>${GPSSpeedUtils.formatSpeed(maxSpeed)}</strong></article>`;

      function dayKey(ms) {
        const d = new Date(Number(ms)||Date.now());
        return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      }

      function dayLabel(ms) {
        const d = new Date(Number(ms)||Date.now());
        const today = new Date();
        const yesterday = new Date(); yesterday.setDate(today.getDate()-1);
        if (dayKey(d.getTime()) === dayKey(today.getTime())) return 'Hoje';
        if (dayKey(d.getTime()) === dayKey(yesterday.getTime())) return 'Ontem';
        return d.toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long', year:'numeric' });
      }

      function timeLabel(ms) {
        return new Date(Number(ms)||Date.now()).toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
      }

      const groups = new Map();
      trips.forEach((trip) => {
        const key = dayKey(trip.startedAt);
        if (!groups.has(key)) groups.set(key, []);
        groups.get(key).push(trip);
      });

      timeline.innerHTML = Array.from(groups.entries()).map(([key, dayTrips]) => {
        const dayKm = dayTrips.reduce((sum,t) => sum + (Number(t.distanceKm)||0), 0);
        const dayMs = dayTrips.reduce((sum,t) => sum + (Number(t.elapsedMs)||0), 0);
        const cards = dayTrips.map((trip) => `
          <article class="history-card">
            <div class="history-head">
              <div>
                <div class="history-time">${timeLabel(trip.startedAt)} → ${timeLabel(trip.finishedAt || trip.startedAt)}</div>
                <div class="history-main">${GPSSpeedUtils.formatDistanceKm(trip.distanceKm)}</div>
              </div>
              <strong>${GPSSpeedUtils.formatDuration(trip.elapsedMs)}</strong>
            </div>
            <div class="history-meta">
              <span>Máx.: <strong>${GPSSpeedUtils.formatSpeed(trip.maxSpeed)}</strong></span>
              <span>Média: <strong>${GPSSpeedUtils.formatSpeed(trip.averageSpeed)}</strong></span>
              <span>Movimento: <strong>${GPSSpeedUtils.formatDuration(trip.movingMs)}</strong></span>
              <span>Parado: <strong>${GPSSpeedUtils.formatDuration(trip.stoppedMs)}</strong></span>
              <span>Pontos GPS: <strong>${Number(trip.pointCount)||0}</strong></span>
              <span>Início: <strong>${timeLabel(trip.startedAt)}</strong></span>
            </div>
            <div class="history-actions">
              <a href="mapa.html?id=${encodeURIComponent(trip.id)}">Ver trajeto</a>
              <a href="viagem.html?id=${encodeURIComponent(trip.id)}">Detalhes</a>
            </div>
          </article>`).join('');

        return `
          <section class="day-block">
            <div class="day-header">
              <h2>${GPSSpeedUtils.escapeHtml(dayLabel(dayTrips[0].startedAt))}</h2>
              <div class="day-total">${GPSSpeedUtils.formatDistanceKm(dayKm)}<br>${GPSSpeedUtils.formatDuration(dayMs)}</div>
            </div>
            <div class="history-list">${cards}</div>
          </section>`;
      }).join('');
    })();
  </script>
</body>
</html>
