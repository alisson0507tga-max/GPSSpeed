<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Mapa - GPSSpeed</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>#routeMap{min-height:560px;border-radius:22px;overflow:hidden;background:#111827;border:1px solid #334155}.map-select{width:100%;padding:14px 16px;border-radius:14px;font-size:16px;margin-bottom:12px}.route-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.route-summary .stat-card{min-height:auto}.route-marker{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;border:3px solid white;box-shadow:0 4px 14px #0007}.route-marker-start{background:#22c55e;color:#07110a}.route-marker-end{background:#ef4444;color:#fff}.route-marker-current{background:#2563eb;color:#fff;font-size:21px}.live-badge{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border-radius:999px;background:#162033;color:#dbeafe;font-size:14px}.live-dot{width:9px;height:9px;border-radius:50%;background:#22c55e}.map-status{margin:0 0 12px;padding:10px 12px;border-radius:12px;background:#162033;color:#d1d5db;font-size:14px}.map-toolbar{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}.map-toolbar button,.map-actions button,.layer-actions button{min-height:44px;border:1px solid #334155;border-radius:12px;background:#111827;color:#cbd5e1;font-weight:700}.map-toolbar button.active,.layer-actions button.active{background:#20304a;color:#fff;border-color:#3b82f6}.map-actions,.layer-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.rotate-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.rotate-actions button{min-height:42px;border-radius:12px}.map-note{font-size:12px;color:#94a3b8}.leaflet-control-attribution{font-size:9px!important}</style></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">ROTA GPS</p><h1>Mapa</h1></div></header><div id="liveBadge" class="live-badge" hidden><span class="live-dot"></span>Percurso atual ao vivo</div><select id="tripSelect" class="map-select"></select><div class="map-toolbar"><button data-map-style="street">Padrão</button><button data-map-style="satellite">Satélite</button><button data-map-style="hybrid">Híbrido</button><button data-map-style="terrain">Terreno</button></div><p id="mapStatus" class="map-status">Buscando sua localização...</p><section id="routeSummary" class="route-summary" hidden></section><div id="routeMap"></div><div class="map-actions"><button id="recenterBtn">Centralizar</button><button id="followBtn">Seguir: ligado</button></div><div class="layer-actions"><button id="kmBtn">Marcos de km: ligados</button><button id="speedColorBtn">Cores por velocidade: ligadas</button></div><div class="rotate-actions"><button id="rotateLeft">↺ Girar</button><button id="northBtn">Norte ↑</button><button id="rotateRight">Girar ↻</button></div><p class="map-note">Toque na linha do percurso para ver velocidade, horário, distância, altitude, precisão e coordenadas daquele ponto.</p><nav class="bottom-nav"><a href="../index.html">Velocímetro</a><a class="active" href="mapa.html">Mapa</a><a href="historico.html">Percursos</a><a href="estatisticas.html">Estatísticas</a><a href="configuracoes.html">Config.</a></nav></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="../js/utils.js"></script><script src="../js/database.js"></script><script src="../js/trips.js"></script><script src="../js/map.js"></script><script>(()=>{const select=document.getElementById('tripSelect'),summary=document.getElementById('routeSummary'),liveBadge=document.getElementById('liveBadge'),statusEl=document.getElementById('mapStatus'),styleButtons=[...document.querySelectorAll('[data-map-style]')],kmBtn=document.getElementById('kmBtn'),speedColorBtn=document.getElementById('speedColorBtn');const trips=GPSSpeedTrips.getTrips();let map=null,live=null,timer=null,watch=null,currentPoint=null,follow=true,style=GPSSpeedMap.getSavedStyle?.()||'hybrid';let kmVisible=GPSSpeedMap.getKmMarkersVisible?.()!==false,speedColors=GPSSpeedMap.getSpeedColorsVisible?.()!==false;function localCheckpoint(){try{const r=localStorage.getItem('gpsspeed.activeTrip.v3')||localStorage.getItem('gpsspeed.activeTrip.v2');return r?JSON.parse(r):null;}catch(_){return null;}}function native(){try{if(!window.AndroidBridge?.getTrackingSnapshot)return null;const r=AndroidBridge.getTrackingSnapshot();return typeof r==='string'?JSON.parse(r):r;}catch(_){return null;}}function liveSnapshot(){const n=native(),l=localCheckpoint();if(n&&['running','paused'].includes(n.status))return n;if(l&&['running','paused'].includes(l.status))return l;return null;}function bestPoint(){const n=native();if(n?.lastPoint)return n.lastPoint;const l=localCheckpoint(),p=l?.points;if(Array.isArray(p)&&p.length)return p.at(-1);return currentPoint;}function destroy(){if(timer){clearInterval(timer);timer=null;}if(live){live.destroy();live=null;}else if(map)map.remove();map=null;}function syncButtons(){styleButtons.forEach(b=>b.classList.toggle('active',b.dataset.mapStyle===style));kmBtn.classList.toggle('active',kmVisible);speedColorBtn.classList.toggle('active',speedColors);kmBtn.textContent=`Marcos de km: ${kmVisible?'ligados':'desligados'}`;speedColorBtn.textContent=`Cores por velocidade: ${speedColors?'ligadas':'desligadas'}`;}function options(){const s=liveSnapshot(),arr=['<option value="__current__">Minha localização</option>'];if(s)arr.push('<option value="__live__">Percurso atual (ao vivo)</option>');trips.forEach(t=>arr.push(`<option value="${GPSSpeedUtils.escapeHtml(t.id)}">${GPSSpeedUtils.escapeHtml(GPSSpeedUtils.formatDateTime(t.startedAt))} — ${GPSSpeedUtils.formatDistanceKm(t.distanceKm)}</option>`));select.innerHTML=arr.join('');return!!s;}function renderLive(points){if(!live)live=GPSSpeedMap.renderLiveMap('routeMap',points,{style,follow});else{live.setFollow(follow);live.update(points,follow);}return live;}function drawCurrent(force=false){liveBadge.hidden=true;summary.hidden=true;const p=bestPoint();if(!p){statusEl.textContent='Buscando sua localização...';if(!live)renderLive([]);return;}statusEl.textContent=`Sua localização atual${Number.isFinite(+p.accuracy)?' • precisão '+Math.round(+p.accuracy)+' m':''}`;renderLive([p]);if(force)live?.recenter();}function drawLive(){const s=liveSnapshot();if(!s){select.value='__current__';destroy();drawCurrent(true);return;}const pts=Array.isArray(s.points)?s.points.slice():[];if(s.lastPoint)pts.push(s.lastPoint);liveBadge.hidden=false;statusEl.textContent='Atualizando rota em tempo real';summary.hidden=false;const last=s.lastPoint||pts.at(-1),elapsed=Math.max(0,Date.now()-(+s.startedAt||Date.now())-(+s.totalPausedMs||0));summary.innerHTML=`<article class="stat-card"><span>Status</span><strong>${s.status==='paused'?'Pausado':'Gravando'}</strong></article><article class="stat-card"><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(elapsed)}</strong></article><article class="stat-card"><span>Velocidade</span><strong>${GPSSpeedUtils.formatSpeed(+last?.speedKmh||0)}</strong></article><article class="stat-card"><span>Precisão</span><strong>${Number.isFinite(+last?.accuracy)?Math.round(+last.accuracy)+' m':'--'}</strong></article>`;renderLive(pts);}function drawSaved(id){const t=GPSSpeedTrips.getTrip(id);if(!t)return;liveBadge.hidden=true;statusEl.textContent=`Percurso salvo • ${t.kilometerSplits?.length||0} km completos`;summary.hidden=false;summary.innerHTML=`<article class="stat-card"><span>Distância</span><strong>${GPSSpeedUtils.formatDistanceKm(t.distanceKm)}</strong></article><article class="stat-card"><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(t.elapsedMs)}</strong></article><article class="stat-card"><span>Máxima</span><strong>${GPSSpeedUtils.formatSpeed(t.maxSpeed)}</strong></article><article class="stat-card"><span>Média</span><strong>${GPSSpeedUtils.formatSpeed(t.averageSpeed)}</strong></article>`;map=GPSSpeedMap.renderTripMap('routeMap',t,{style});map?._gpsspeedSetKmMarkers?.(kmVisible);map?._gpsspeedSetSpeedColors?.(speedColors);}function draw(){destroy();if(select.value==='__current__')drawCurrent(true);else if(select.value==='__live__'){drawLive();timer=setInterval(drawLive,2500);}else drawSaved(select.value);}styleButtons.forEach(b=>b.addEventListener('click',()=>{style=['street','satellite','hybrid','terrain'].includes(b.dataset.mapStyle)?b.dataset.mapStyle:'hybrid';GPSSpeedMap.saveStyle(style);if(live?.setBaseStyle)live.setBaseStyle(style);else map?._gpsspeedSetBaseStyle?.(style);syncButtons();}));document.getElementById('recenterBtn').addEventListener('click',()=>{if(live)live.recenter();else if(map){const t=GPSSpeedTrips.getTrip(select.value),p=t?.points?.at(-1);if(p)map.setView([+p.latitude,+p.longitude],17);}});document.getElementById('followBtn').addEventListener('click',e=>{follow=!follow;live?.setFollow(follow);e.currentTarget.textContent=`Seguir: ${follow?'ligado':'desligado'}`;if(follow)live?.recenter();});kmBtn.addEventListener('click',()=>{kmVisible=!kmVisible;map?._gpsspeedSetKmMarkers?.(kmVisible);syncButtons();});speedColorBtn.addEventListener('click',()=>{speedColors=!speedColors;map?._gpsspeedSetSpeedColors?.(speedColors);syncButtons();});document.getElementById('rotateLeft').addEventListener('click',()=>live?.rotateBy?.(-30)||map?._gpsspeedRotation?.rotateBy(-30));document.getElementById('rotateRight').addEventListener('click',()=>live?.rotateBy?.(30)||map?._gpsspeedRotation?.rotateBy(30));document.getElementById('northBtn').addEventListener('click',()=>live?.resetBearing?.()||map?._gpsspeedRotation?.reset());const hasLive=options(),requested=GPSSpeedUtils.getQueryParam('id');if(requested&&trips.some(t=>t.id===requested))select.value=requested;else select.value=hasLive?'__live__':'__current__';select.addEventListener('change',draw);if(navigator.geolocation)watch=navigator.geolocation.watchPosition(p=>{currentPoint={timestamp:p.timestamp||Date.now(),latitude:p.coords.latitude,longitude:p.coords.longitude,accuracy:p.coords.accuracy,altitude:p.coords.altitude,heading:p.coords.heading,speedKmh:Number.isFinite(p.coords.speed)?p.coords.speed*3.6:0};if(select.value==='__current__')drawCurrent(false);},()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:15000});syncButtons();draw();})();</script></body></html>
