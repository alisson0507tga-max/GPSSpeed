<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Viagem - GPSSpeed</title><link rel="stylesheet" href="../css/style.css"><style>.detail-section{margin:14px 0;padding:16px;border-radius:18px;background:#162033}.detail-section h2{margin:0 0 12px;font-size:18px}.detail-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-item{padding:10px;border-radius:12px;background:#111827}.detail-item span{display:block;color:#94a3b8;font-size:12px}.detail-item strong{display:block;margin-top:4px;font-size:16px}.speed-bar{height:10px;background:#0b1220;border-radius:999px;overflow:hidden;margin-top:7px}.speed-bar i{display:block;height:100%;background:#22d3ee;border-radius:999px}</style></head>
<body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">DETALHES DO PERCURSO</p><h1>Viagem</h1></div></header><section id="tripDetails" class="stats-grid"></section><section id="extraDetails" class="detail-section"></section><section class="trip-actions"><a id="viewMap" class="primary-action" href="mapa.html">Ver rota completa no mapa</a><button id="shareGpx" type="button">Compartilhar rota GPX</button><button id="deleteTrip" type="button">Excluir percurso</button></section><p id="tripStatus" class="location-card" hidden></p><p id="tripError" class="location-card" hidden>Percurso não encontrado.</p><nav class="bottom-nav"><a href="../index.html">Velocímetro</a><a href="mapa.html">Mapa</a><a class="active" href="historico.html">Histórico</a><a href="configuracoes.html">Config.</a></nav></main>
<script src="../js/utils.js"></script><script src="../js/database.js"></script><script src="../js/trips.js"></script><script>(()=>{const id=GPSSpeedUtils.getQueryParam('id'),trip=GPSSpeedTrips.getTrip(id),details=document.getElementById('tripDetails'),extra=document.getElementById('extraDetails'),error=document.getElementById('tripError'),status=document.getElementById('tripStatus'),map=document.getElementById('viewMap'),del=document.getElementById('deleteTrip'),share=document.getElementById('shareGpx');if(!trip){error.hidden=false;details.hidden=true;extra.hidden=true;map.hidden=true;del.hidden=true;share.hidden=true;return;}const pts=Array.isArray(trip.points)?trip.points:[],speeds=pts.map(p=>Number(p.speedKmh)).filter(Number.isFinite),accuracies=pts.map(p=>Number(p.accuracy)).filter(v=>Number.isFinite(v)&&v>0),alts=pts.map(p=>Number(p.altitude)).filter(Number.isFinite),endAt=Number(trip.finishedAt)||((Number(trip.startedAt)||0)+(Number(trip.elapsedMs)||0)),movingPct=trip.elapsedMs?Math.round((Number(trip.movingMs)||0)/trip.elapsedMs*100):0,bestAccuracy=accuracies.length?Math.min(...accuracies):null,avgAccuracy=accuracies.length?accuracies.reduce((a,b)=>a+b,0)/accuracies.length:null,minAlt=alts.length?Math.min(...alts):null,maxAlt=alts.length?Math.max(...alts):null;details.innerHTML=`<article class="stat-card"><span>Início</span><strong>${GPSSpeedUtils.escapeHtml(GPSSpeedUtils.formatDateTime(trip.startedAt))}</strong></article><article class="stat-card"><span>Fim</span><strong>${GPSSpeedUtils.escapeHtml(GPSSpeedUtils.formatDateTime(endAt))}</strong></article><article class="stat-card"><span>Distância</span><strong>${GPSSpeedUtils.formatDistanceKm(trip.distanceKm)}</strong></article><article class="stat-card"><span>Tempo total</span><strong>${GPSSpeedUtils.formatDuration(trip.elapsedMs)}</strong></article><article class="stat-card"><span>Em movimento</span><strong>${GPSSpeedUtils.formatDuration(trip.movingMs)}</strong></article><article class="stat-card"><span>Parado</span><strong>${GPSSpeedUtils.formatDuration(trip.stoppedMs)}</strong></article><article class="stat-card"><span>Máxima</span><strong>${GPSSpeedUtils.formatSpeed(trip.maxSpeed)}</strong></article><article class="stat-card"><span>Média</span><strong>${GPSSpeedUtils.formatSpeed(trip.averageSpeed)}</strong></article>`;extra.innerHTML=`<h2>Análise do percurso</h2><div class="detail-list"><div class="detail-item"><span>Tempo em movimento</span><strong>${movingPct}%</strong><div class="speed-bar"><i style="width:${Math.min(100,movingPct)}%"></i></div></div><div class="detail-item"><span>Pontos GPS</span><strong>${pts.length}</strong></div><div class="detail-item"><span>Melhor precisão</span><strong>${bestAccuracy===null?'--':Math.round(bestAccuracy)+' m'}</strong></div><div class="detail-item"><span>Precisão média</span><strong>${avgAccuracy===null?'--':Math.round(avgAccuracy)+' m'}</strong></div><div class="detail-item"><span>Altitude mínima</span><strong>${minAlt===null?'--':Math.round(minAlt)+' m'}</strong></div><div class="detail-item"><span>Altitude máxima</span><strong>${maxAlt===null?'--':Math.round(maxAlt)+' m'}</strong></div><div class="detail-item"><span>Amostras de velocidade</span><strong>${speeds.length}</strong></div><div class="detail-item"><span>Tipo</span><strong>${trip.automatic?'Automático':'Manual'}</strong></div></div>`;map.href=`mapa.html?id=${encodeURIComponent(trip.id)}`;share.addEventListener('click',()=>{try{const gpx=GPSSpeedTrips.tripToGpx(trip);if(window.AndroidBridge?.shareText)AndroidBridge.shareText('Rota GPSSpeed',gpx,'application/gpx+xml');else if(navigator.share)navigator.share({title:'Rota GPSSpeed',text:gpx});status.textContent='Rota preparada para compartilhar.';status.hidden=false;}catch(e){status.textContent='Não foi possível exportar esta rota.';status.hidden=false;}});del.addEventListener('click',()=>{if(confirm('Excluir este percurso?')){GPSSpeedTrips.deleteTrip(trip.id);location.href='historico.html';}});})();</script></body></html>
