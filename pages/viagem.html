<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Percurso - GPSSpeed</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>.section{margin:14px 0;padding:16px;border-radius:18px;background:#162033}.section h2{margin:0 0 12px;font-size:18px}.detail-list{display:grid;grid-template-columns:1fr 1fr;gap:10px}.detail-item{padding:10px;border-radius:12px;background:#111827}.detail-item span{display:block;color:#94a3b8;font-size:12px}.km-list{display:grid;gap:9px}.km-card{padding:13px;border-radius:14px;background:#111827}.km-head{display:flex;justify-content:space-between;gap:10px}.km-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.km-grid span{font-size:11px;color:#94a3b8}.km-grid strong{display:block;font-size:14px}#tripMap{height:430px;border-radius:18px;overflow:hidden}.chart-wrap{position:relative;width:100%;overflow:hidden}.chart-wrap canvas{width:100%;height:230px;background:#0b1220;border-radius:14px;touch-action:manipulation}.chart-tip{margin-top:8px;color:#cbd5e1;font-size:13px}</style></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">DETALHES DO PERCURSO</p><h1>Percurso</h1></div></header><section id="tripDetails" class="stats-grid"></section><section id="extraDetails" class="section"></section><section class="section"><h2>Mapa completo</h2><div id="tripMap"></div><p id="mapPointInfo" class="chart-tip">Toque na linha para consultar um ponto.</p></section><section class="section"><h2>Velocidade × distância</h2><div class="chart-wrap"><canvas id="speedChart" width="700" height="260"></canvas></div><p id="chartInfo" class="chart-tip">Toque no gráfico para destacar o mesmo ponto no mapa.</p></section><section class="section"><h2>Velocidade de cada quilômetro</h2><div id="kmList" class="km-list"></div></section><section class="trip-actions"><button id="shareGpx">Compartilhar rota GPX</button><button id="deleteTrip">Excluir percurso</button></section><p id="tripStatus" class="location-card" hidden></p><p id="tripError" class="location-card" hidden>Percurso não encontrado.</p><nav class="bottom-nav"><a href="../index.html">Velocímetro</a><a href="mapa.html">Mapa</a><a class="active" href="historico.html">Percursos</a><a href="estatisticas.html">Estatísticas</a><a href="configuracoes.html">Config.</a></nav></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="../js/utils.js"></script><script src="../js/database.js"></script><script src="../js/trips.js"></script><script src="../js/map.js"></script><script>(()=>{const id=GPSSpeedUtils.getQueryParam('id'),trip=GPSSpeedTrips.getTrip(id),details=document.getElementById('tripDetails'),extra=document.getElementById('extraDetails'),error=document.getElementById('tripError'),status=document.getElementById('tripStatus'),share=document.getElementById('shareGpx'),del=document.getElementById('deleteTrip'),kmList=document.getElementById('kmList'),canvas=document.getElementById('speedChart'),ctx=canvas.getContext('2d'),chartInfo=document.getElementById('chartInfo'),mapInfo=document.getElementById('mapPointInfo');if(!trip){error.hidden=false;return;}const pts=Array.isArray(trip.points)?trip.points:[],splits=Array.isArray(trip.kilometerSplits)?trip.kilometerSplits:[],accuracies=pts.map(p=>+p.accuracy).filter(v=>Number.isFinite(v)&&v>0),alts=pts.map(p=>+p.altitude).filter(Number.isFinite),endAt=+trip.finishedAt||(+trip.startedAt+(+trip.elapsedMs||0)),movingPct=trip.elapsedMs?Math.round((+trip.movingMs||0)/trip.elapsedMs*100):0;details.innerHTML=`<article class="stat-card"><span>Início</span><strong>${GPSSpeedUtils.formatDateTime(trip.startedAt)}</strong></article><article class="stat-card"><span>Fim</span><strong>${GPSSpeedUtils.formatDateTime(endAt)}</strong></article><article class="stat-card"><span>Distância</span><strong>${GPSSpeedUtils.formatDistanceKm(trip.distanceKm)}</strong></article><article class="stat-card"><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(trip.elapsedMs)}</strong></article><article class="stat-card"><span>Média</span><strong>${GPSSpeedUtils.formatSpeed(trip.averageSpeed)}</strong></article><article class="stat-card"><span>Máxima</span><strong>${GPSSpeedUtils.formatSpeed(trip.maxSpeed)}</strong></article>`;extra.innerHTML=`<h2>Dados GPS</h2><div class="detail-list"><div class="detail-item"><span>Em movimento</span><strong>${GPSSpeedUtils.formatDuration(trip.movingMs)} (${movingPct}%)</strong></div><div class="detail-item"><span>Parado</span><strong>${GPSSpeedUtils.formatDuration(trip.stoppedMs)}</strong></div><div class="detail-item"><span>Pontos GPS</span><strong>${pts.length}</strong></div><div class="detail-item"><span>Quilômetros completos</span><strong>${splits.length}</strong></div><div class="detail-item"><span>Melhor precisão</span><strong>${accuracies.length?Math.round(Math.min(...accuracies))+' m':'--'}</strong></div><div class="detail-item"><span>Precisão média</span><strong>${accuracies.length?Math.round(accuracies.reduce((a,b)=>a+b,0)/accuracies.length)+' m':'--'}</strong></div><div class="detail-item"><span>Altitude mínima</span><strong>${alts.length?Math.round(Math.min(...alts))+' m':'--'}</strong></div><div class="detail-item"><span>Altitude máxima</span><strong>${alts.length?Math.round(Math.max(...alts))+' m':'--'}</strong></div></div>`;kmList.innerHTML=splits.length?splits.map(s=>`<article class="km-card"><div class="km-head"><strong>KM ${s.kilometer}</strong><span>${new Date(+s.startedAt).toLocaleTimeString('pt-BR')} → ${new Date(+s.finishedAt).toLocaleTimeString('pt-BR')}</span></div><div class="km-grid"><div><span>Média</span><strong>${(+s.averageSpeed||0).toFixed(1)} km/h</strong></div><div><span>Máxima</span><strong>${(+s.maxSpeed||0).toFixed(1)} km/h</strong></div><div><span>Tempo</span><strong>${GPSSpeedUtils.formatDuration(s.elapsedMs)}</strong></div></div></article>`).join(''):'<p>Nenhum quilômetro completo registrado.</p>';let selectedIndex=-1;function nearestByDistance(km){let best=0,d=Infinity;pts.forEach((p,i)=>{const delta=Math.abs((+p.cumulativeDistanceMeters||0)/1000-km);if(delta<d){d=delta;best=i;}});return best;}function drawChart(){const w=canvas.width,h=canvas.height,pad={l:48,r:18,t:20,b:35},maxD=Math.max(.1,+trip.distanceKm||.1),maxS=Math.max(30,...pts.map(p=>Math.max(+p.speedKmh||0,+p.calculatedSpeedKmh||0)));ctx.clearRect(0,0,w,h);ctx.strokeStyle='#334155';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=pad.t+(h-pad.t-pad.b)*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();}ctx.fillStyle='#94a3b8';ctx.font='12px sans-serif';ctx.fillText('km/h',6,16);ctx.fillText('km',w-28,h-8);ctx.strokeStyle='#22d3ee';ctx.lineWidth=3;ctx.beginPath();pts.forEach((p,i)=>{const d=(+p.cumulativeDistanceMeters||0)/1000,s=Math.max(+p.speedKmh||0,+p.calculatedSpeedKmh||0),x=pad.l+d/maxD*(w-pad.l-pad.r),y=pad.t+(1-s/maxS)*(h-pad.t-pad.b);if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();if(selectedIndex>=0&&pts[selectedIndex]){const p=pts[selectedIndex],d=(+p.cumulativeDistanceMeters||0)/1000,s=Math.max(+p.speedKmh||0,+p.calculatedSpeedKmh||0),x=pad.l+d/maxD*(w-pad.l-pad.r),y=pad.t+(1-s/maxS)*(h-pad.t-pad.b);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();}}function selectPoint(p,index){selectedIndex=index>=0?index:pts.indexOf(p);drawChart();const d=(+p.cumulativeDistanceMeters||0)/1000,s=Math.max(+p.speedKmh||0,+p.calculatedSpeedKmh||0);const text=`${d.toFixed(2)} km • ${s.toFixed(1)} km/h • ${new Date(+p.timestamp).toLocaleTimeString('pt-BR')}`;chartInfo.textContent=text;mapInfo.textContent=text;}const map=GPSSpeedMap.renderTripMap('tripMap',trip,{style:GPSSpeedMap.getSavedStyle(),onPointSelected:p=>selectPoint(p,pts.indexOf(p))});canvas.addEventListener('click',e=>{const rect=canvas.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*canvas.width,padL=48,padR=18,maxD=Math.max(.1,+trip.distanceKm||.1),km=Math.max(0,Math.min(maxD,(x-padL)/(canvas.width-padL-padR)*maxD)),i=nearestByDistance(km),p=pts[i];if(!p)return;selectPoint(p,i);map.setView([+p.latitude,+p.longitude],Math.max(map.getZoom(),16),{animate:true});L.popup().setLatLng([+p.latitude,+p.longitude]).setContent(`<strong>${Math.max(+p.speedKmh||0,+p.calculatedSpeedKmh||0).toFixed(1)} km/h</strong><br>${((+p.cumulativeDistanceMeters||0)/1000).toFixed(2)} km<br>${new Date(+p.timestamp).toLocaleTimeString('pt-BR')}`).openOn(map);});drawChart();share.addEventListener('click',()=>{try{const gpx=GPSSpeedTrips.tripToGpx(trip);if(window.AndroidBridge?.shareText)AndroidBridge.shareText('Rota GPSSpeed',gpx,'application/gpx+xml');status.textContent='Rota preparada para compartilhar.';status.hidden=false;}catch(_){status.textContent='Não foi possível exportar.';status.hidden=false;}});del.addEventListener('click',()=>{if(confirm('Excluir este percurso?')){GPSSpeedTrips.deleteTrip(trip.id);location.href='historico.html';}});})();</script></body></html>
