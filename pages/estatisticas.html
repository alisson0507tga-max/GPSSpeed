<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Estatísticas - GPSSpeed</title><link rel="stylesheet" href="../css/style.css"><style>.period-list{display:grid;gap:10px;margin-top:14px}.period-row{display:flex;justify-content:space-between;gap:12px;padding:13px;border-radius:14px;background:#162033}.period-row span{color:#94a3b8}.big-stat{font-size:28px}</style></head><body><main class="app-shell"><header class="topbar"><div><p class="eyebrow">COMPUTADOR DE BORDO</p><h1>Estatísticas</h1></div></header><section id="stats" class="stats-grid"></section><section class="location-card" style="display:block"><strong>Distância por período</strong><div id="periods" class="period-list"></div></section><nav class="bottom-nav"><a href="../index.html">Velocímetro</a><a href="mapa.html">Mapa</a><a href="historico.html">Percursos</a><a class="active" href="estatisticas.html">Estatísticas</a><a href="configuracoes.html">Config.</a></nav></main><script src="../js/utils.js"></script><script src="../js/database.js"></script><script src="../js/trips.js"></script><script>(()=>{const trips=GPSSpeedTrips.getTrips(),s=GPSSpeedTrips.getStatistics(),stats=document.getElementById('stats'),periods=document.getElementById('periods');stats.innerHTML=`<article class="stat-card"><span>Distância total</span><strong class="big-stat">${s.totalDistanceKm.toLocaleString('pt-BR',{maximumFractionDigits:1})} km</strong></article><article class="stat-card"><span>Tempo dirigindo</span><strong>${GPSSpeedUtils.formatDuration(s.totalMovingMs)}</strong></article><article class="stat-card"><span>Percursos</span><strong>${s.tripCount}</strong></article><article class="stat-card"><span>Maior percurso</span><strong>${s.longestTripKm.toLocaleString('pt-BR',{maximumFractionDigits:1})} km</strong></article><article class="stat-card"><span>Maior velocidade</span><strong>${Math.round(s.maxSpeed)} km/h</strong></article><article class="stat-card"><span>Média geral</span><strong>${Math.round(s.overallAverageSpeed)} km/h</strong></article>`;const now=new Date(),startDay=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime(),startWeek=startDay-((now.getDay()+6)%7)*86400000,startMonth=new Date(now.getFullYear(),now.getMonth(),1).getTime();function distanceSince(ts){return trips.filter(t=>(+t.startedAt||0)>=ts).reduce((sum,t)=>sum+(+t.distanceKm||0),0);}periods.innerHTML=`<div class="period-row"><span>Hoje</span><strong>${distanceSince(startDay).toFixed(1)} km</strong></div><div class="period-row"><span>Esta semana</span><strong>${distanceSince(startWeek).toFixed(1)} km</strong></div><div class="period-row"><span>Este mês</span><strong>${distanceSince(startMonth).toFixed(1)} km</strong></div>`;})();</script></body></html>
